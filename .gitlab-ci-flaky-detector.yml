# Optional template: include from .gitlab-ci.yml and set GITLAB_TOKEN.
ci-history-report:
  stage: test
  image: python:3.13
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - python -m pip install -e .
  script:
    - |
      set +e
      flaky-detector ci-gitlab "$CI_PROJECT_ID" \
        --days "${FLAKY_DAYS:-30}" --ref "$CI_DEFAULT_BRANCH" \
        --url "$CI_SERVER_URL" > flaky-report.txt 2>&1
      result=$?
      cat flaky-report.txt
      if [ "$result" -eq 1 ]; then
        echo "Candidates found; inspect the report."
        exit 0
      fi
      exit "$result"
  artifacts:
    when: always
    paths:
      - flaky-report.txt
    expire_in: 30 days
