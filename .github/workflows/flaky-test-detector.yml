name: CI History Report

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days of history to inspect
        type: number
        default: 30

permissions:
  actions: read
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Inspect recent history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DAYS: ${{ inputs.days }}
        run: |
          set +e
          flaky-detector ci-github "$REPOSITORY" --days "$DAYS" --branch main 2>&1 | tee flaky-report.txt
          result=${PIPESTATUS[0]}
          if [ "$result" -eq 1 ]; then
            echo "Candidates found; inspect the report."
            exit 0
          fi
          exit "$result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-history-report
          path: flaky-report.txt
